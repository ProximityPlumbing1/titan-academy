<body data-theme="dark">

<!-- LOGIN GATE -->
<div id="gate" class="gate">
  <div class="gatecard">
    <svg class="logo" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M32 4 L58 12 V34 C58 48 46 56 32 61 C18 56 6 48 6 34 V12 Z" fill="none" stroke="#0265DC" stroke-width="4" stroke-linejoin="round"/><rect x="17" y="17.5" width="30" height="6.5" rx="1" fill="#0265DC"/><rect x="28.75" y="17.5" width="6.5" height="32" rx="1" fill="#0265DC"/><rect x="17.5" y="24.5" width="4.5" height="20" rx="1" fill="#6DBAF8"/><rect x="42" y="24.5" width="4.5" height="20" rx="1" fill="#6DBAF8"/></svg>
    <h1 class="brand">TITAN<b> ACADEMY</b></h1>
    <div class="gsub">ServiceTitan Onboarding</div>
    <input id="gname" type="text" placeholder="Full name" autocomplete="name" style="display:none" onkeydown="if(event.key==='Enter')gateSubmit()" />
    <input id="gemail" type="email" placeholder="Email" autocomplete="email" onkeydown="if(event.key==='Enter')gateSubmit()" />
    <input id="gp" type="password" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')gateSubmit()" />
    <select id="gu" aria-label="Your role" style="display:none">
      <option value="" disabled selected>Select your role…</option>
      <option value="owner">Owner</option>
      <option value="managers">Managers</option>
      <option value="scrdsr">SCR / DSR</option>
      <option value="supportoffice">Support VA</option>
      <option value="installtech">Install Tech</option>
      <option value="servicetech">Service Tech</option>
      <option value="accounts">Accounts</option>
      <option value="marketingpro">Marketing</option>
    </select>
    <button id="gbtn" onclick="gateSubmit()">Sign in</button>
    <div style="display:flex;align-items:center;gap:10px;margin:14px 0 12px;color:var(--muted-2);font-size:11px;letter-spacing:1px"><span style="flex:1;height:1px;background:var(--line)"></span>OR<span style="flex:1;height:1px;background:var(--line)"></span></div>
    <button type="button" id="ggoogle" onclick="googleSignin()" style="width:100%;background:#fff;color:#1f1f1f;border:1px solid var(--line);border-radius:12px;padding:13px 16px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Continue with Google
    </button>
    <div class="err" id="gerr"></div>
    <div class="ghint" id="ghint">New to Titan Academy? <a href="#" onclick="toggleSignup();return false" style="color:var(--cyan-2);text-decoration:underline">Create an account</a></div>
  </div>
</div>

<div class="bgfx" aria-hidden="true"><span style="left:7%;width:7px;height:7px;animation-duration:27s;animation-delay:-2s"></span><span style="left:21%;width:5px;height:5px;animation-duration:34s;animation-delay:-9s"></span><span style="left:34%;width:9px;height:9px;animation-duration:24s;animation-delay:-14s"></span><span style="left:48%;width:6px;height:6px;animation-duration:31s;animation-delay:-5s"></span><span style="left:61%;width:4px;height:4px;animation-duration:38s;animation-delay:-18s"></span><span style="left:73%;width:8px;height:8px;animation-duration:26s;animation-delay:-11s"></span><span style="left:85%;width:6px;height:6px;animation-duration:33s;animation-delay:-3s"></span><span style="left:93%;width:5px;height:5px;animation-duration:29s;animation-delay:-21s"></span></div>
<div class="phone" id="app" style="display:none"></div>
<div class="toast" id="toast"><span class="te"></span><span class="tt"></span></div>
